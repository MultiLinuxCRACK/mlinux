name: Build MLinux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/build-mlinux-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools
      - name: Configure MLinux
        run: |
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer false \
            --security false \
            --bootappend-live "boot=live components username=mlinux hostname=mlinux"
      - name: Build bootable ISO
        run: sudo lb build
      - name: Rename ISO
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.hybrid.iso' -print -quit)"
          test -n "$ISO"
          mv "$ISO" MLinux-amd64.iso
          sha256sum MLinux-amd64.iso > MLinux-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MLinux-amd64-ISO
          path: |
            MLinux-amd64.iso
            MLinux-amd64.iso.sha256
          compression-level: 0
          retention-days: 14
